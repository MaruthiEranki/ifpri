<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <title>VIKAS-AI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20342e;
      --muted: #77817a;
      --paper: #f4f5ef;
      --white: #fff;
      --forest: #183e33;
      --forest-deep: #12342c;
      --lime: #d7e76e;
      --line: #e5e8df;
      --coral: #d7795e;
      --sans: "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
    }
    .brand { display: flex; align-items: center; gap: 13px; position: relative; z-index: 1; }
    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 36%);
      color: var(--lime);
      font: 700 18px var(--serif);
      letter-spacing: 0;
    }
    .brand-name { font-size: 13px; font-weight: 700; letter-spacing: .08em; }
    .login-panel { width: min(100%, 440px); display: grid; place-items: center; padding: 38px; border: 1px solid var(--line); background: var(--white); }
    .login-form { width: 100%; animation: arrive .55s ease both; }
    .login-form h2 { margin: 0; font: 400 42px/1.1 var(--serif); letter-spacing: 0; }
    .login-form h2 { margin-bottom: 28px; }
    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 9px; color: #3a4942; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .input-wrap { position: relative; }
    .field input { width: 100%; height: 50px; padding: 0 15px; border: 1px solid #dce1d8; border-radius: 2px; outline: none; color: var(--ink); background: #fff; font-size: 13px; transition: border-color .16s, box-shadow .16s; }
    .field input::placeholder { color: #a1aaa3; }
    .field input:focus { border-color: var(--forest); box-shadow: 0 0 0 3px rgb(24 62 51 / 9%); }
    .field input[type="password"], .field input.password-visible { padding-right: 72px; }
    .reveal-password { position: absolute; top: 0; right: 0; height: 50px; padding: 0 14px; border: 0; color: #66736c; background: transparent; font-size: 10px; font-weight: 700; }
    .reveal-password:hover { color: var(--forest); }
    .submit-button { width: 100%; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-radius: 2px; color: #fff; background: var(--forest); font-size: 12px; font-weight: 700; transition: background .16s, transform .16s; }
    .submit-button:hover { background: var(--forest-deep); transform: translateY(-1px); }
    .submit-arrow { color: var(--lime); font-size: 18px; font-weight: 400; }
    .form-error { min-height: 18px; margin: 10px 0 0; color: #aa4839; font-size: 11px; }

    .dashboard { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar { min-height: 100vh; display: flex; flex-direction: column; padding: 27px 17px 18px; color: #eff2e9; background: var(--forest); }
    .sidebar .brand { padding: 0 10px 30px; }
    .sidebar .brand-mark { width: 38px; height: 38px; font-size: 16px; }
    .sidebar .brand-name { font-size: 11px; }
    .side-caption { padding: 0 12px; margin: 0 0 11px; color: rgb(239 242 233 / 46%); font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { width: 100%; min-height: 45px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 2px; color: rgb(239 242 233 / 72%); background: transparent; text-align: left; font-size: 12px; transition: color .16s, background .16s; }
    .nav-item:hover { color: #fff; background: rgb(255 255 255 / 7%); }
    .nav-item[aria-current="page"] { color: var(--forest-deep); background: var(--lime); font-weight: 700; }
    .nav-glyph { width: 19px; height: 19px; display: grid; flex: 0 0 19px; place-items: center; border: 1px solid currentColor; border-radius: 50%; font: 10px var(--serif); }
    .sidebar-bottom { margin-top: auto; padding: 17px 10px 0; border-top: 1px solid rgb(255 255 255 / 13%); }
    .user-block { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .user-avatar { width: 32px; height: 32px; display: grid; flex: 0 0 32px; place-items: center; border-radius: 50%; color: var(--forest-deep); background: var(--lime); font: 14px var(--serif); text-transform: uppercase; }
    .user-meta { min-width: 0; flex: 1; }
    .user-name { overflow: hidden; color: #fff; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .user-role { margin-top: 4px; color: rgb(239 242 233 / 52%); font-size: 9px; }
    .logout-button { margin-top: 15px; padding: 6px 0; border: 0; color: rgb(239 242 233 / 66%); background: transparent; font-size: 10px; }
    .logout-button:hover { color: var(--lime); }

    .main-area { min-width: 0; display: flex; flex-direction: column; background: var(--paper); }
    .topbar { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 38px; border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 82%); }
    .breadcrumb { display: flex; align-items: center; gap: 10px; color: #929a93; font-size: 10px; }
    .breadcrumb strong { color: #405149; font-weight: 700; }
    .breadcrumb-separator { color: #c2c8bf; }
    .topbar-right { color: #87928a; font-size: 10px; }
    .content { width: 100%; max-width: 1240px; flex: 1; margin: 0 auto; padding: clamp(30px, 5vw, 64px) clamp(24px, 5vw, 64px); animation: arrive .45s ease both; }
    .content-heading { padding-bottom: 23px; border-bottom: 1px solid #dfe3da; }
    .content-heading .eyebrow { color: #87934b; font-size: 9px; }
    .content-heading h1 { margin: 14px 0 0; font: 400 36px/1.15 var(--serif); letter-spacing: 0; }
    .empty-space { min-height: 260px; }
    .content-footer { padding-top: 14px; border-top: 1px solid #e4e7df; color: #a0a79f; font-size: 9px; letter-spacing: .06em; }
    .content-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    .heading-copy { min-width: 0; }
    .primary-action { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 14px; border: 0; border-radius: 2px; color: #fff; background: var(--forest); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .primary-action:hover { background: var(--forest-deep); }
    .primary-action span:first-child { color: var(--lime); font-size: 17px; font-weight: 400; }
    .records-panel { margin-top: 22px; }
    .record-toolbar { min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 9px; }
    .record-count { color: #7d8981; font-size: 10px; }
    .archive-toggle { padding: 7px 0; border: 0; color: var(--forest); background: transparent; font-size: 10px; font-weight: 700; }
    .archive-toggle:hover { text-decoration: underline; }
    .record-table { width: 100%; border-collapse: collapse; background: #fff; }
    .record-table th { padding: 12px 15px; border-bottom: 1px solid #dfe3da; color: #849087; background: #fbfcf9; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-align: left; text-transform: uppercase; }
    .record-table th:last-child { text-align: right; }
    .record-table td { padding: 14px 15px; border-bottom: 1px solid #edf0e9; color: #43534b; font-size: 11px; line-height: 1.5; }
    .record-table tr:last-child td { border-bottom: 0; }
    .record-table td:first-child { width: 68%; color: #263a32; font-weight: 600; }
    .scheme-status { display: inline-flex; align-items: center; gap: 6px; color: #7f7563; font-size: 9px; white-space: nowrap; }
    .scheme-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #b8a16f; }
    .scheme-status[data-status="Active"] { color: #416d4d; }
    .scheme-status[data-status="Active"]::before { background: #6d9a65; }
    .scheme-actions { display: flex; justify-content: flex-end; gap: 7px; white-space: nowrap; }
    .row-action { min-height: 30px; padding: 0 10px; border: 1px solid #dfe4da; border-radius: 2px; color: #354c41; background: #fff; font-size: 10px; font-weight: 700; }
    .row-action:hover { border-color: #9eab9f; background: #f7f9f4; }
    .row-action.archive-action { color: #a05240; }
    .row-action.archive-action:hover { border-color: #d9a697; background: #fff8f5; }
    .record-feedback { min-height: 20px; margin: 10px 0; color: #55704f; font-size: 10px; }
    .record-editor { margin-top: 22px; animation: arrive .3s ease both; }
    .editor-back { display: inline-flex; align-items: center; gap: 9px; padding: 7px 0; border: 0; color: #65736a; background: transparent; font-size: 10px; font-weight: 700; }
    .editor-back:hover { color: var(--forest); }
    .editor-back span:first-child { color: var(--coral); font-size: 16px; font-weight: 400; }
    .record-editor-heading { padding: 0 0 22px; border-bottom: 1px solid #dfe3da; }
    .record-editor-kicker { margin: 17px 0 8px; color: #87934b; font-size: 9px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .record-editor-heading h2 { margin: 0; font: 400 32px/1.15 var(--serif); }
    .record-editor-intro { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .record-form-groups { padding-bottom: 12px; }
    .record-form-group { padding: 22px 0 8px; border-bottom: 1px solid #e4e7df; }
    .record-form-group h3 { margin: 0 0 16px; color: #34483e; font: 400 18px/1.2 var(--serif); }
    .record-form-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
    .record-editor .field { min-width: 0; margin-bottom: 16px; }
    .record-editor .field input, .record-editor .field select, .record-editor .field textarea { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid #dce1d8; border-radius: 2px; color: var(--ink); background: #fff; font-size: 11px; }
    .record-editor .field textarea { min-height: 66px; resize: vertical; line-height: 1.5; }
    .record-editor-actions { position: sticky; bottom: 0; z-index: 2; display: flex; justify-content: flex-end; gap: 9px; margin-top: 7px; padding: 14px 0; border-top: 1px solid #dfe3da; background: rgb(244 245 239 / 96%); }
    .editor-cancel { min-height: 40px; padding: 0 15px; border: 1px solid #dfe4da; border-radius: 2px; color: #43534b; background: #fff; font-size: 11px; }
    .editor-save { min-height: 40px; padding: 0 16px; border: 0; border-radius: 2px; color: #fff; background: var(--forest); font-size: 11px; font-weight: 700; }
    .records-empty { padding: 32px 15px; color: var(--muted); background: #fff; font-size: 12px; text-align: center; }
    .advisory-panel { max-width: 900px; margin-top: 22px; }
    .advisory-form { padding: 24px; border: 1px solid var(--line); background: #fff; }
    .advisory-form-heading { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .advisory-form-heading .eyebrow { color: #87934b; font-size: 9px; }
    .advisory-form-heading p { margin: 10px 0 0; color: var(--muted); font-size: 11px; }
    .advisory-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; padding-top: 22px; }
    .advisory-form .field { min-width: 0; margin-bottom: 18px; }
    .advisory-form .field input, .advisory-form .field select, .advisory-form .field textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #dce1d8; border-radius: 2px; color: var(--ink); background: #fff; font-size: 12px; }
    .advisory-form .field textarea { min-height: 116px; resize: vertical; line-height: 1.6; }
    .advisory-content-field { grid-column: 1 / -1; }
    .advisory-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 15px; border-top: 1px solid var(--line); }

    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 760px) {
      .login-panel { padding: 28px 22px; }
      .login-form { max-width: 460px; }
      .dashboard { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; padding: 16px 16px 13px; }
      .sidebar .brand { padding: 0 4px 17px; }
      .side-caption { padding: 0 5px; margin-bottom: 8px; }
      .nav-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .nav-item { min-height: 40px; gap: 9px; padding: 0 9px; font-size: 11px; }
      .nav-glyph { width: 17px; height: 17px; flex-basis: 17px; font-size: 9px; }
      .sidebar-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 4px 0; }
      .logout-button { flex: 0 0 auto; margin: 0; }
      .topbar { min-height: 56px; padding: 0 20px; }
      .content { padding: 30px 22px; }
      .content-heading h1 { font-size: 31px; }
      .record-table thead { display: none; }
      .record-table, .record-table tbody { display: block; }
      .record-table tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px; padding: 12px 13px; border-bottom: 1px solid #edf0e9; }
      .record-table tbody tr:last-child { border-bottom: 0; }
      .record-table td { padding: 4px 0; border: 0; }
      .record-table td:first-child { width: auto; grid-column: 1 / -1; padding-bottom: 8px; }
      .record-table td:last-child { justify-self: end; }
      .scheme-actions { gap: 5px; }
      .row-action { min-height: 29px; padding: 0 8px; }
      .record-form-fields { grid-template-columns: 1fr; }
      .advisory-form { padding: 19px; }
      .advisory-fields { grid-template-columns: 1fr; gap: 0; }
      .advisory-content-field { grid-column: auto; }
    }
    @media (max-width: 380px) {
      .nav-list { grid-template-columns: 1fr; }
      .nav-item { min-height: 38px; }
      .topbar-right { display: none; }
    }
  </style>
</head>
<body>
  <main id="loginScreen" class="login-screen">
    <section class="login-panel" aria-labelledby="loginTitle">
      <form id="loginForm" class="login-form">
        <h2 id="loginTitle">Sign in</h2>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Your username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
            <button id="revealPassword" class="reveal-password" type="button" aria-label="Show password" aria-pressed="false">SHOW</button>
          </div>
        </div>
        <button class="submit-button" type="submit"><span>Sign in</span><span class="submit-arrow" aria-hidden="true">→</span></button>
        <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main id="dashboard" class="dashboard" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div>
          <div class="brand-name">VIKAS-AI</div>
        </div>
      </div>
      <p class="side-caption">Content</p>
      <nav id="navigation" class="nav-list" aria-label="Content sections">
        <button class="nav-item" type="button" data-section="Advisory" aria-current="page"><span class="nav-glyph" aria-hidden="true">A</span><span>Advisory</span></button>
        <button class="nav-item" type="button" data-section="Schemes"><span class="nav-glyph" aria-hidden="true">S</span><span>Schemes</span></button>
        <button class="nav-item" type="button" data-section="Programs"><span class="nav-glyph" aria-hidden="true">P</span><span>Programs</span></button>
        <button class="nav-item" type="button" data-section="Initiatives"><span class="nav-glyph" aria-hidden="true">I</span><span>Initiatives</span></button>
        <button class="nav-item" type="button" data-section="Campaigns"><span class="nav-glyph" aria-hidden="true">C</span><span>Campaigns</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="user-block">
          <div id="userAvatar" class="user-avatar" aria-hidden="true">u</div>
          <div class="user-meta"><div id="userName" class="user-name">User</div><div class="user-role">Content member</div></div>
        </div>
        <button id="logoutButton" class="logout-button" type="button">Sign out</button>
      </div>
    </aside>
    <section class="main-area" aria-label="Content">
      <header class="topbar">
        <div class="breadcrumb"><span>Content</span><span class="breadcrumb-separator" aria-hidden="true">/</span><strong id="breadcrumbTitle">Advisory</strong></div>
        <div class="topbar-right">VIKAS-AI</div>
      </header>
      <div class="content">
        <div class="content-heading">
          <div class="heading-copy"><div class="eyebrow">Content section</div><h1 id="sectionTitle">Advisory</h1></div>
          <button id="addRecordButton" class="primary-action" type="button" hidden><span aria-hidden="true">+</span><span id="addRecordLabel">Add record</span></button>
        </div>
        <section id="recordsPanel" class="records-panel" aria-label="Records list" hidden>
          <div id="recordListView">
            <div class="record-toolbar">
              <div id="recordCount" class="record-count" aria-live="polite"></div>
              <button id="archiveToggle" class="archive-toggle" type="button" hidden></button>
            </div>
            <table class="record-table">
              <thead><tr><th id="recordNameHeader" scope="col">Name</th><th id="recordStatusHeader" scope="col" hidden>Status</th><th scope="col">Actions</th></tr></thead>
              <tbody id="recordRows"></tbody>
            </table>
            <p id="recordFeedback" class="record-feedback" aria-live="polite"></p>
          </div>
          <section id="recordEditor" class="record-editor" aria-labelledby="recordEditorTitle" hidden>
            <div class="record-editor-heading">
              <button id="recordBackButton" class="editor-back" type="button"><span aria-hidden="true">←</span><span>Back to <span id="recordBackSection">Schemes</span></span></button>
              <p id="recordEditorKicker" class="record-editor-kicker">Schemes / New record</p>
              <h2 id="recordEditorTitle">Add scheme</h2>
              <p id="recordEditorIntro" class="record-editor-intro"></p>
            </div>
            <form id="recordForm">
              <div id="recordFormGroups" class="record-form-groups"></div>
              <div class="record-editor-actions">
                <button class="editor-cancel" type="button" id="cancelRecordButton">Cancel</button>
                <button id="saveRecordButton" class="editor-save" type="submit">Save changes</button>
              </div>
            </form>
          </section>
        </section>
        <section id="advisoryPanel" class="advisory-panel" aria-label="Advisory form" hidden>
          <form id="advisoryForm" class="advisory-form">
            <div class="advisory-form-heading">
              <div class="eyebrow">Create an advisory</div>
              <p>Choose a type and enter the advisory details.</p>
            </div>
            <div class="advisory-fields">
              <div class="field advisory-type-field">
                <label for="advisoryType">Type</label>
                <select id="advisoryType" name="type" required>
                  <option value="" selected>Select type</option>
                  <option value="Weather">Weather</option>
                  <option value="Sewa">Sewa</option>
                </select>
              </div>
              <div class="field">
                <label for="advisoryName">Name</label>
                <input id="advisoryName" name="name" type="text" maxlength="200" placeholder="Enter advisory name" required>
              </div>
              <div class="field advisory-content-field">
                <label for="advisoryContent">Content</label>
                <textarea id="advisoryContent" name="content" rows="5" maxlength="5000" placeholder="Enter advisory content" required></textarea>
              </div>
              <div class="field">
                <label for="advisoryThreshold">Threshold</label>
                <input id="advisoryThreshold" name="threshold" type="number" step="any" placeholder="Enter threshold" required>
              </div>
            </div>
            <div class="advisory-actions">
              <button id="cancelAdvisoryButton" class="editor-cancel" type="button">Cancel</button>
              <button class="editor-save" type="submit">Submit</button>
            </div>
            <p id="advisoryFeedback" class="record-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
        <div id="genericContentSpace" class="empty-space" aria-live="polite"></div>
        <footer class="content-footer">VIKAS-AI</footer>
      </div>
    </section>
  </main>

  <script>
    const loginScreen = document.querySelector("#loginScreen");
    const dashboard = document.querySelector("#dashboard");
    const loginForm = document.querySelector("#loginForm");
    const usernameInput = document.querySelector("#username");
    const passwordInput = document.querySelector("#password");
    const formError = document.querySelector("#formError");
    const revealPassword = document.querySelector("#revealPassword");
    const recordsPanel = document.querySelector("#recordsPanel");
    const advisoryPanel = document.querySelector("#advisoryPanel");
    const advisoryForm = document.querySelector("#advisoryForm");
    const recordRows = document.querySelector("#recordRows");
    const recordForm = document.querySelector("#recordForm");
    const recordFormGroups = document.querySelector("#recordFormGroups");
    const recordStoragePrefix = "ifpri-records-";
    const sectionSchemas = {
      Schemes: {
        fields: [
          "Scheme Name", "Description", "Eligibility Criteria", "Application form",
          "Schemes official source", "If available - FAQ", "Occupation", "Owner",
          "Reach", "Impact", "Learnings", "Case studies references", "SEWA vertical",
          "Good to have citizens testimonials and experiance about the schmemes", "Active/Inactive"
        ],
        groups: [
          { title: "Scheme overview", fields: ["Scheme Name", "Description", "Eligibility Criteria", "Application form", "Schemes official source", "If available - FAQ"] },
          { title: "Coverage and status", fields: ["Occupation", "Owner", "Reach", "SEWA vertical", "Active/Inactive"] },
          { title: "Impact and learning", fields: ["Impact", "Learnings", "Case studies references", "Good to have citizens testimonials and experiance about the schmemes"] }
        ],
        sampleFields: ["Scheme Name", "Description", "Eligibility Criteria", "Schemes official source", "Occupation", "Impact", "Active/Inactive"],

    let showingArchived = false;
    let activeRecordSection = "Schemes";
    let editingRecordId = null;
    let recordSequence = 0;

    function createRecord(section, sample, id) {
      const schema = sectionSchemas[section];
      const fields = Object.fromEntries(schema.fields.map((field) => [field, ""]));
      const sampleValues = Array.isArray(sample)
        ? Object.fromEntries(schema.sampleFields.map((field, index) => [field, sample[index]]))
        : sample;
      Object.entries(sampleValues).forEach(([field, value]) => {
        if (schema.fields.includes(field) && typeof value === "string") fields[field] = value;
      });
      if (schema.fields.includes("Active/Inactive") && !fields["Active/Inactive"]) fields["Active/Inactive"] = "Inactive";
      return { id, fields, archived: false };
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[character]);
    }

    function normalizeRecord(section, record, index) {
      const schema = sectionSchemas[section];
      const fields = Object.fromEntries(schema.fields.map((field) => [field, ""]));
      schema.fields.forEach((field) => {
        const value = record.fields?.[field];
        if (typeof value === "string") fields[field] = value;
      });
      if (!fields[schema.fields[0]] && typeof record.name === "string") fields[schema.fields[0]] = record.name;
      if (schema.fields.includes("Active/Inactive") && record.status) fields["Active/Inactive"] = record.status;
      if (schema.fields.includes("Active/Inactive") && !fields["Active/Inactive"]) fields["Active/Inactive"] = "Inactive";
      return { id: record.id ?? `legacy-${section}-${index}`, fields, archived: Boolean(record.archived) };
    }

    function recordNameKey(section, record) {
      const nameField = sectionSchemas[section].fields[0];
      return String(record.fields[nameField] || "").trim().replace(/\s+/g, " ").toLocaleLowerCase();
    }

    const workbookSeedVersion = "2";
    const needsWorkbookSeedMerge = localStorage.getItem("ifpri-workbook-seed-version") !== workbookSeedVersion;
    const recordsBySection = Object.fromEntries(Object.entries(sectionSchemas).map(([section, schema]) => {
      let savedRecords;
      try {
        savedRecords = JSON.parse(localStorage.getItem(`${recordStoragePrefix}${section.toLowerCase()}`));
      } catch {
        savedRecords = null;
      }
      if (!Array.isArray(savedRecords) && section === "Schemes") {
        try {
          savedRecords = JSON.parse(localStorage.getItem("ifpri-schemes"));
        } catch {
          savedRecords = null;
        }
      }
      const seedRecords = schema.samples.map((sample, index) => createRecord(section, sample, `sample-${section.toLowerCase()}-${index}`));
      const records = Array.isArray(savedRecords)
        ? savedRecords.map((record, index) => normalizeRecord(section, record, index))
        : seedRecords;
      if (Array.isArray(savedRecords) && needsWorkbookSeedMerge) {
        const seedsByName = new Map(seedRecords.map((record) => [recordNameKey(section, record), record]));
        records.forEach((record) => {
          const seed = seedsByName.get(recordNameKey(section, record));
          if (!seed) return;
          schema.fields.forEach((field) => {
            if (!record.fields[field]?.trim() && seed.fields[field]) record.fields[field] = seed.fields[field];
          });
          seedsByName.delete(recordNameKey(section, record));
        });
        records.push(...seedsByName.values());
      }
      return [section, records];
    }));

    if (needsWorkbookSeedMerge) {
      Object.entries(recordsBySection).forEach(([section, records]) => {
        localStorage.setItem(`${recordStoragePrefix}${section.toLowerCase()}`, JSON.stringify(records));
      });
      localStorage.setItem("ifpri-workbook-seed-version", workbookSeedVersion);
    }

    function persistRecords(section = activeRecordSection) {
      localStorage.setItem(`${recordStoragePrefix}${section.toLowerCase()}`, JSON.stringify(recordsBySection[section]));
    }

    function renderRecords() {
      const schema = sectionSchemas[activeRecordSection];
      const records = recordsBySection[activeRecordSection];
      const nameField = schema.fields[0];
      const statusField = schema.fields.includes("Active/Inactive") ? "Active/Inactive" : null;
      const visibleRecords = records.filter((record) => Boolean(record.archived) === showingArchived);
      const archivedCount = records.filter((record) => record.archived).length;
      const singular = activeRecordSection.slice(0, -1).toLowerCase();
      document.querySelector("#recordNameHeader").textContent = nameField;
      document.querySelector("#recordStatusHeader").hidden = !statusField;
      document.querySelector("#recordCount").textContent = `${visibleRecords.length} ${showingArchived ? "archived " : ""}${activeRecordSection.toLowerCase()}`;
      const archiveToggle = document.querySelector("#archiveToggle");
      archiveToggle.hidden = archivedCount === 0;
      archiveToggle.textContent = showingArchived ? `Back to ${activeRecordSection.toLowerCase()}` : `View archived (${archivedCount})`;
      recordRows.innerHTML = visibleRecords.map((record) => `
        <tr>
          <td>${escapeHTML(record.fields[nameField] || "Untitled")}</td>
          ${statusField ? `<td><span class="scheme-status" data-status="${escapeHTML(record.fields[statusField])}">${escapeHTML(record.fields[statusField])}</span></td>` : ""}
          <td><div class="scheme-actions">
            <button class="row-action" type="button" data-action="edit" data-record-id="${escapeHTML(record.id)}">Edit</button>
            <button class="row-action archive-action" type="button" data-action="${showingArchived ? "restore" : "archive"}" data-record-id="${escapeHTML(record.id)}">${showingArchived ? "Restore" : "Archive"}</button>
          </div></td>
        </tr>`).join("");
      if (visibleRecords.length === 0) {
        const emptyMessage = showingArchived ? `No archived ${activeRecordSection.toLowerCase()}.` : `No ${activeRecordSection.toLowerCase()} yet. Add a ${singular} to get started.`;
        recordRows.innerHTML = `<tr><td class="records-empty" colspan="${statusField ? 3 : 2}">${emptyMessage}</td></tr>`;
      }
    }

    function openRecordEditor(record = null) {
      const schema = sectionSchemas[activeRecordSection];
      const singular = activeRecordSection.slice(0, -1).toLowerCase();
      editingRecordId = record?.id ?? null;
      if (!record) {
        showingArchived = false;
        renderRecords();
      }
      const editorTitle = `${record ? "Edit" : "Add"} ${singular}`;
      document.querySelector("#recordEditorKicker").textContent = `${activeRecordSection} / ${record ? "Edit" : "New"}`;
      document.querySelector("#recordEditorTitle").textContent = editorTitle;
      document.querySelector("#recordEditorIntro").textContent = `${record ? "Update" : "Enter"} the ${singular} details below.`;
      document.querySelector("#recordBackSection").textContent = activeRecordSection.toLowerCase();
      document.querySelector("#saveRecordButton").textContent = record ? "Save changes" : `Add ${singular}`;
      const longFields = new Set([
        "Description", "Eligibility Criteria", "Goal", "Impact", "Learnings",
        "Good to have citizens testimonials and experiance about the schmemes",
        "Any other reference material", "Reference resources"
      ]);
      recordFormGroups.innerHTML = schema.groups.map((group) => `
        <section class="record-form-group">
          <h3>${escapeHTML(group.title)}</h3>
          <div class="record-form-fields">
            ${group.fields.map((field) => {
              const index = schema.fields.indexOf(field);
              const id = `recordField${index}`;
              const value = record?.fields[field] ?? (field === "Active/Inactive" ? "Inactive" : "");
              let control;
              if (field === "Active/Inactive") {
                control = `<select id="${id}" name="${id}"><option value="Active" ${value === "Active" ? "selected" : ""}>Active</option><option value="Inactive" ${value === "Inactive" ? "selected" : ""}>Inactive</option></select>`;
              } else if (index === 0) {
                control = `<input id="${id}" name="${id}" type="text" maxlength="250" value="${escapeHTML(value)}" required>`;
              } else {
                control = `<textarea id="${id}" name="${id}" rows="2" maxlength="5000">${escapeHTML(value)}</textarea>`;
              }
              const fieldClass = longFields.has(field) ? "field record-field-wide" : "field";
              return `<div class="${fieldClass}"><label for="${id}">${escapeHTML(field)}</label>${control}</div>`;
            }).join("")}
          </div>
        </section>`).join("");
      document.querySelector("#recordListView").hidden = true;
      document.querySelector("#recordEditor").hidden = false;
      document.querySelector("#addRecordButton").hidden = true;
      recordFormGroups.querySelector("input, textarea, select")?.focus();
      document.querySelector("#recordEditor").scrollIntoView({ block: "start", behavior: "smooth" });
    }

    function closeRecordEditor() {
      document.querySelector("#recordEditor").hidden = true;
      document.querySelector("#recordListView").hidden = false;
      document.querySelector("#addRecordButton").hidden = false;
      editingRecordId = null;
      recordForm.reset();
    }

    renderRecords();

    function showDashboard(username) {
      loginScreen.hidden = true;
      dashboard.hidden = false;
      document.querySelector("#userName").textContent = username;
      document.querySelector("#userAvatar").textContent = username.trim().charAt(0) || "u";
      setWorkspaceSection("Advisory");
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password.trim()) {
        formError.textContent = "Enter both your username and password.";
        return;
      }
      formError.textContent = "";
      showDashboard(username);
    });

    revealPassword.addEventListener("click", () => {
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      revealPassword.textContent = isVisible ? "SHOW" : "HIDE";
      revealPassword.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
      revealPassword.setAttribute("aria-pressed", String(!isVisible));
    });

    function setWorkspaceSection(section) {
      if (!document.querySelector("#recordEditor").hidden) closeRecordEditor();
      document.querySelectorAll(".nav-item").forEach((item) => item.removeAttribute("aria-current"));
      const activeButton = document.querySelector(`.nav-item[data-section="${section}"]`);
      activeButton?.setAttribute("aria-current", "page");
      document.querySelector("#sectionTitle").textContent = section;
      document.querySelector("#breadcrumbTitle").textContent = section;
      const isManagedSection = Object.hasOwn(sectionSchemas, section);
      const isAdvisory = section === "Advisory";
      recordsPanel.hidden = !isManagedSection;
      advisoryPanel.hidden = !isAdvisory;
      document.querySelector("#addRecordButton").hidden = !isManagedSection;
      document.querySelector("#genericContentSpace").hidden = isManagedSection || isAdvisory;
      activeRecordSection = isManagedSection ? section : "";
      showingArchived = false;
      if (isManagedSection) {
        document.querySelector("#addRecordLabel").textContent = `Add ${section.slice(0, -1).toLowerCase()}`;
        document.querySelector("#recordFeedback").textContent = "";
        renderRecords();
      }
    }

    document.querySelector("#navigation").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-section]");
      if (!button) return;
      setWorkspaceSection(button.dataset.section);
    });

    advisoryForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(advisoryForm);
      const advisories = JSON.parse(localStorage.getItem("vikasai-advisories") || "[]");
      advisories.push({
        type: formData.get("type"),
        name: String(formData.get("name")).trim(),
        content: String(formData.get("content")).trim(),
        threshold: Number(formData.get("threshold")),
        submittedAt: new Date().toISOString()
      });
      localStorage.setItem("vikasai-advisories", JSON.stringify(advisories));
      advisoryForm.reset();
      document.querySelector("#advisoryFeedback").textContent = "Advisory submitted.";
    });

    document.querySelector("#cancelAdvisoryButton").addEventListener("click", () => {
      advisoryForm.reset();
      document.querySelector("#advisoryFeedback").textContent = "";
    });

    document.querySelector("#addRecordButton").addEventListener("click", () => openRecordEditor());

    document.querySelector("#cancelRecordButton").addEventListener("click", () => closeRecordEditor());
    document.querySelector("#recordBackButton").addEventListener("click", () => closeRecordEditor());

    recordForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const schema = sectionSchemas[activeRecordSection];
      const fields = Object.fromEntries(schema.fields.map((field, index) => [
        field,
        recordForm.elements.namedItem(`recordField${index}`).value.trim()
      ]));
      const records = recordsBySection[activeRecordSection];
      if (editingRecordId) {
        const record = records.find((item) => item.id === editingRecordId);
        if (record) record.fields = fields;
      } else {
        records.unshift({ id: `record-${Date.now().toString(36)}-${++recordSequence}`, fields, archived: false });
      }
      const message = `${activeRecordSection.slice(0, -1)} saved.`;
      persistRecords();
      closeRecordEditor();
      renderRecords();
      document.querySelector("#recordFeedback").textContent = message;
    });

    document.querySelector("#archiveToggle").addEventListener("click", () => {
      showingArchived = !showingArchived;
      document.querySelector("#recordFeedback").textContent = "";
      renderRecords();
    });

    recordRows.addEventListener("click", (event) => {
      const actionButton = event.target.closest("button[data-action]");
      if (!actionButton) return;
      const records = recordsBySection[activeRecordSection];
      const record = records.find((item) => item.id === actionButton.dataset.recordId);
      if (!record) return;
      const action = actionButton.dataset.action;
      if (action === "edit") {
        openRecordEditor(record);
        return;
      }
      record.archived = action === "archive";
      if (action === "restore") showingArchived = false;
      persistRecords();
      renderRecords();
      document.querySelector("#recordFeedback").textContent = action === "archive" ? `${activeRecordSection.slice(0, -1)} archived.` : `${activeRecordSection.slice(0, -1)} restored.`;
    });

    document.querySelector("#logoutButton").addEventListener("click", () => {
      dashboard.hidden = true;
      loginScreen.hidden = false;
      loginForm.reset();
      formError.textContent = "";
      passwordInput.type = "password";
      revealPassword.textContent = "SHOW";
      revealPassword.setAttribute("aria-label", "Show password");
      revealPassword.setAttribute("aria-pressed", "false");
      usernameInput.focus();
    });
  </script>
</body>
</html>
